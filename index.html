<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <footer id="contacto-section">
  <!-- Formulario de Contacto -->
  <div class="contacto-container">
    <h2>Contáctanos</h2>
    <form id="formulario-contacto">
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
      </div>
      <div>
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo">
      </div>
      <div>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje"></textarea>
      </div>
      <button type="submit">Enviar</button>
      <p id="mensaje-error" style="color: red;"></p>
    </form>
   <div class="redes-sociales"> 
    <p>Síguenos en nuestras redes:</p> 
    <i class="fa-brands fa-facebook red-facebook"></i> 
    <i class="fa-brands fa-instagram red-instagram"></i>
    <i class="fa-brands fa-x-twitter red-twitter"></i>
    <i class="fa-brands fa-whatsapp red-whatsapp"></i>
  </div>



  <!-- Pie de página (Footer) -->
  <div class="footer-creditos">
    <p>&copy; 2026 Tienda Deportiva Online. Todos los derechos reservados.</p>
  </div>
</footer>
<script src="./main.js"></script>

</body>
</html>
